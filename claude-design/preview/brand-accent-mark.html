<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: #F6FAFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #173B64; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .accent-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .accent-label { font-size: 9px; font-weight: 800; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.08em; }
  .section-block { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
  .section-label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #7c858d; }
</style>
</head>
<body>
  <div class="row">
    <!-- Growth variant -->
    <div class="accent-item">
      <svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true">
        <path d="M36 6c10.4 0 20.8 3 28 8.8v19.4c0 15.4-10.4 25.5-28 31.8C18.4 59.7 8 49.6 8 34.2V14.8C15.2 9 25.6 6 36 6Z" fill="#ffde70" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
        <path d="M20 47.5h31" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round"/>
        <path d="M22 41.5 30.5 34l7 4.5 13-15" fill="none" stroke="#173B64" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M45 23.5h5.5V29" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="accent-label">Growth</div>
    </div>

    <!-- Chat variant -->
    <div class="accent-item">
      <svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true">
        <path d="M36 6c10.4 0 20.8 3 28 8.8v19.4c0 15.4-10.4 25.5-28 31.8C18.4 59.7 8 49.6 8 34.2V14.8C15.2 9 25.6 6 36 6Z" fill="#ffde70" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
        <path d="M22 20.5h28c3.3 0 6 2.7 6 6v13c0 3.3-2.7 6-6 6H36l-8.8 7.2c-1.4 1.1-3.5.1-3.5-1.7v-5.5H22c-3.3 0-6-2.7-6-6v-13c0-3.3 2.7-6 6-6Z" fill="#F6FAFF" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
        <path d="M24.5 31h23" stroke="#173B64" stroke-width="4" stroke-linecap="round"/>
        <path d="M24.5 37.5h15" stroke="#173B64" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="accent-label">Chat</div>
    </div>

    <!-- Tick variant -->
    <div class="accent-item">
      <svg width="56" height="56" viewBox="0 0 72 72" aria-hidden="true">
        <path d="M36 6c10.4 0 20.8 3 28 8.8v19.4c0 15.4-10.4 25.5-28 31.8C18.4 59.7 8 49.6 8 34.2V14.8C15.2 9 25.6 6 36 6Z" fill="#ffde70" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
        <path d="M22 37.5 31 46.5 49.5 25.5" fill="none" stroke="#173B64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="accent-label">Tick</div>
    </div>

    <!-- Large -->
    <div class="accent-item">
      <svg width="80" height="80" viewBox="0 0 72 72" aria-hidden="true">
        <path d="M36 6c10.4 0 20.8 3 28 8.8v19.4c0 15.4-10.4 25.5-28 31.8C18.4 59.7 8 49.6 8 34.2V14.8C15.2 9 25.6 6 36 6Z" fill="#ffde70" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
        <path d="M20 47.5h31" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round"/>
        <path d="M22 41.5 30.5 34l7 4.5 13-15" fill="none" stroke="#173B64" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M45 23.5h5.5V29" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="accent-label">Large (80px)</div>
    </div>
  </div>

  <!-- In-context usage -->
  <div class="section-block" style="margin-top:28px;">
    <svg width="48" height="48" viewBox="0 0 72 72">
      <path d="M36 6c10.4 0 20.8 3 28 8.8v19.4c0 15.4-10.4 25.5-28 31.8C18.4 59.7 8 49.6 8 34.2V14.8C15.2 9 25.6 6 36 6Z" fill="#ffde70" stroke="#173B64" stroke-width="4" stroke-linejoin="round"/>
      <path d="M20 47.5h31" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round"/>
      <path d="M22 41.5 30.5 34l7 4.5 13-15" fill="none" stroke="#173B64" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45 23.5h5.5V29" fill="none" stroke="#173B64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="section-label">Score Pushing</div>
      <div style="font-size:22px;font-weight:900;color:#173B64;line-height:1.1;margin-top:4px">Improve your next score<br>unimaginably with <span style="color:#ffde70">Score Rush</span></div>
    </div>
  </div>
</body>
</html>
