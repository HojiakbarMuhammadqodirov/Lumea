<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #F0F5FC; font-family: 'DM Sans', sans-serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 80px; height: 56px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: 9px; font-weight: 700; color: #6B7E96; text-transform: uppercase; letter-spacing: 0.04em; }
  .val { font-size: 9px; color: #9EB3C8; font-family: monospace; }
  .group-label { font-size: 9px; font-weight: 800; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 14px; }
  .group-label:first-child { margin-top: 0; }
</style>
</head>
<body>
  <div class="group-label">Brand Navy</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#040E1C"></div><div class="name">Dark Blue</div><div class="val">#040E1C</div></div>
    <div class="swatch"><div class="chip" style="background:#0F2746"></div><div class="name">Navy Deep</div><div class="val">#0F2746</div></div>
    <div class="swatch"><div class="chip" style="background:#173B64"></div><div class="name">Navy</div><div class="val">#173B64</div></div>
    <div class="swatch"><div class="chip" style="background:#2762C0"></div><div class="name">Blue Mid</div><div class="val">#2762C0</div></div>
  </div>
  <div class="group-label">Blue Scale</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#dff0ff"></div><div class="name">BG-1</div><div class="val">#dff0ff</div></div>
    <div class="swatch"><div class="chip" style="background:#8bc2ff"></div><div class="name">BG-2</div><div class="val">#8bc2ff</div></div>
    <div class="swatch"><div class="chip" style="background:#0d4f9c"></div><div class="name">BG-3</div><div class="val">#0d4f9c</div></div>
    <div class="swatch"><div class="chip" style="background:#F6FAFF; border:1px solid #DDE6F0"></div><div class="name">Public BG</div><div class="val">#F6FAFF</div></div>
    <div class="swatch"><div class="chip" style="background:#F0F5FC; border:1px solid #DDE6F0"></div><div class="name">App BG</div><div class="val">#F0F5FC</div></div>
  </div>
  <div class="group-label">Accent Yellow</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#FFF3B0"></div><div class="name">Yellow Light</div><div class="val">#FFF3B0</div></div>
    <div class="swatch"><div class="chip" style="background:#ffde70"></div><div class="name">Yellow</div><div class="val">#ffde70</div></div>
    <div class="swatch"><div class="chip" style="background:#F5C400"></div><div class="name">Yellow Deep</div><div class="val">#F5C400</div></div>
  </div>
</body>
</html>
