<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 20px; background: #F0F5FC; font-family: 'DM Sans', sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .box { border-radius: 8px; background: #173B64; }
  .label { font-size: 9px; font-weight: 700; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; }
  .val { font-size: 9px; color: #9EB3C8; font-family: monospace; text-align: center; }
  .radius-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; align-items: flex-end; }
  .r-swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .r-box { width: 56px; height: 40px; background: #173B64; }
  .group-label { font-size: 9px; font-weight: 800; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="group-label">Spacing Scale</div>
  <div class="grid">
    <div class="swatch"><div class="box" style="width:4px;height:24px;"></div><div class="label">1</div><div class="val">4px</div></div>
    <div class="swatch"><div class="box" style="width:8px;height:24px;"></div><div class="label">2</div><div class="val">8px</div></div>
    <div class="swatch"><div class="box" style="width:12px;height:24px;"></div><div class="label">3</div><div class="val">12px</div></div>
    <div class="swatch"><div class="box" style="width:16px;height:24px;"></div><div class="label">4</div><div class="val">16px</div></div>
    <div class="swatch"><div class="box" style="width:20px;height:24px;"></div><div class="label">5</div><div class="val">20px</div></div>
    <div class="swatch"><div class="box" style="width:24px;height:24px;"></div><div class="label">6</div><div class="val">24px</div></div>
    <div class="swatch"><div class="box" style="width:32px;height:24px;"></div><div class="label">8</div><div class="val">32px</div></div>
  </div>

  <div class="group-label" style="margin-top:22px">Border Radius</div>
  <div class="radius-row">
    <div class="r-swatch"><div class="r-box" style="border-radius:8px"></div><div class="label">sm</div><div class="val">8px</div></div>
    <div class="r-swatch"><div class="r-box" style="border-radius:12px"></div><div class="label">md</div><div class="val">12px</div></div>
    <div class="r-swatch"><div class="r-box" style="border-radius:16px"></div><div class="label">lg</div><div class="val">16px</div></div>
    <div class="r-swatch"><div class="r-box" style="border-radius:20px"></div><div class="label">xl</div><div class="val">20px</div></div>
    <div class="r-swatch"><div class="r-box" style="border-radius:999px; width:64px"></div><div class="label">pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
