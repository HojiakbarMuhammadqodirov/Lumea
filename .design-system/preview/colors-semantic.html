<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #F0F5FC; font-family: 'DM Sans', sans-serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { width: 80px; height: 56px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: 9px; font-weight: 700; color: #6B7E96; text-transform: uppercase; letter-spacing: 0.04em; }
  .val { font-size: 9px; color: #9EB3C8; font-family: monospace; }
  .group-label { font-size: 9px; font-weight: 800; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 14px; }
  .group-label:first-child { margin-top: 0; }
</style>
</head>
<body>
  <div class="group-label">Status</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0F9E6A"></div><div class="name">Green</div><div class="val">#0F9E6A</div></div>
    <div class="swatch"><div class="chip" style="background:#6D28D9"></div><div class="name">Purple</div><div class="val">#6D28D9</div></div>
    <div class="swatch"><div class="chip" style="background:#D97706"></div><div class="name">Amber</div><div class="val">#D97706</div></div>
    <div class="swatch"><div class="chip" style="background:#DC2626"></div><div class="name">Red</div><div class="val">#DC2626</div></div>
    <div class="swatch"><div class="chip" style="background:#bf2c55"></div><div class="name">Danger</div><div class="val">#bf2c55</div></div>
  </div>
  <div class="group-label">Neutrals</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#173B64"></div><div class="name">Text</div><div class="val">#173B64</div></div>
    <div class="swatch"><div class="chip" style="background:#4A6580"></div><div class="name">Text Sub</div><div class="val">#4A6580</div></div>
    <div class="swatch"><div class="chip" style="background:#6B7E96"></div><div class="name">Muted</div><div class="val">#6B7E96</div></div>
    <div class="swatch"><div class="chip" style="background:#9EB3C8"></div><div class="name">Hint</div><div class="val">#9EB3C8</div></div>
    <div class="swatch"><div class="chip" style="background:#DDE6F0; border:1px solid #c8d6e4"></div><div class="name">Border</div><div class="val">#DDE6F0</div></div>
    <div class="swatch"><div class="chip" style="background:#FFFFFF; border:1px solid #DDE6F0"></div><div class="name">Card White</div><div class="val">#FFFFFF</div></div>
  </div>
</body>
</html>
