<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #F0F5FC; font-family: 'DM Sans', sans-serif; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .group-label { font-size: 9px; font-weight: 800; color: #9EB3C8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .logo-light { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 900; color: #173B64; letter-spacing: -0.02em; }
  .logo-dark { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 900; color: #F6FAFF; letter-spacing: -0.02em; }
  .logo-small { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 900; color: #173B64; }
  .logo-box { width: 36px; height: 36px; background: #173B64; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <div>
    <div class="group-label">Wordmark (light bg)</div>
    <div style="background:#F6FAFF; padding:20px 28px; border-radius:12px; border:1px solid #DDE6F0;">
      <div class="logo-light">Lumea</div>
    </div>
  </div>
  <div>
    <div class="group-label">Wordmark (dark bg)</div>
    <div style="background:#173B64; padding:20px 28px; border-radius:12px;">
      <div class="logo-dark">Lumea</div>
    </div>
  </div>
  <div>
    <div class="group-label">Dashboard mark</div>
    <div style="display:flex; align-items:center; gap:10px; background:#fff; padding:14px 18px; border-radius:12px; border:1px solid #DDE6F0;">
      <div class="logo-box">L</div>
      <div>
        <div style="font-size:14px;font-weight:700;color:#173B64;line-height:1">LearnNova</div>
        <div style="font-size:9px;color:#9EB3C8;text-transform:uppercase;letter-spacing:0.1em;margin-top:2px">Student Space</div>
      </div>
    </div>
  </div>
  <div>
    <div class="group-label">Size variants</div>
    <div style="display:flex; flex-direction:column; gap:8px; background:#F6FAFF; padding:14px 18px; border-radius:12px; border:1px solid #DDE6F0;">
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:40px;font-weight:900;color:#173B64;letter-spacing:-0.02em;line-height:1">Lumea</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:900;color:#173B64;letter-spacing:-0.02em;line-height:1">Lumea</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:900;color:#173B64;letter-spacing:-0.02em;line-height:1">Lumea</div>
      <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:900;color:#173B64;letter-spacing:-0.01em;line-height:1">Lumea</div>
    </div>
  </div>
</body>
</html>
