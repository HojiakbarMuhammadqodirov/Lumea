// ── UI Primitives ──────────────────────────────────────────────
function Card({ children, style = {}, onClick }) {
  return <div onClick={onClick} style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 16, padding: 20, cursor: onClick ? "pointer" : "default", transition: onClick ? "border-color 150ms, box-shadow 150ms" : "none", ...style }}>{children}</div>;
}
function Card2({ children, style = {} }) {
  return <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 12, padding: 14, ...style }}>{children}</div>;
}
function SLabel({ children, style = {} }) {
  return <div style={{ fontSize: 10, color: C.hint, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, marginBottom: 10, ...style }}>{children}</div>;
}
function Sep({ style = {} }) { return <div style={{ height: 1, background: C.border, margin: "12px 0", ...style }} />; }
function PBar({ pct, color, height = 5 }) {
  return <div style={{ height, background: C.border, borderRadius: 999, overflow: "hidden" }}><div style={{ width: `${Math.min(pct,100)}%`, height, background: color, borderRadius: 999, transition: "width 800ms cubic-bezier(.4,0,.2,1)" }} /></div>;
}
function Avatar({ name, size = 32, color = C.navy }) {
  const initials = name?.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase() || "?";
  return <div style={{ width: size, height: size, borderRadius: "50%", background: color, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 700, fontSize: size * 0.35, flexShrink: 0 }}>{initials}</div>;
}
function Tag({ label, bg, color }) {
  return <span style={{ background: bg, color, fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 999, textTransform: "uppercase", letterSpacing: "0.04em", whiteSpace: "nowrap" }}>{label}</span>;
}
function PlanTag({ plan }) {
  return <Tag label={plan} bg={PLAN_BG[plan] || C.bg} color={PLAN_COLORS[plan] || C.hint} />;
}
function Btn({ children, onClick, style = {}, variant = "primary", disabled = false }) {
  const base = { border: "none", borderRadius: 12, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", fontFamily: "'DM Sans',sans-serif", transition: "all 150ms", opacity: disabled ? 0.45 : 1, display: "inline-flex", alignItems: "center", gap: 6 };
  const variants = {
    primary: { background: C.navy, color: "#fff" },
    ghost: { background: "transparent", color: C.muted, border: `1px solid ${C.border}` },
    danger: { background: C.redDim, color: C.red, border: `1px solid rgba(220,38,38,0.2)` },
    success: { background: C.greenDim, color: C.green, border: `1px solid ${C.greenBorder}` },
  };
  return <button onClick={onClick} disabled={disabled} style={{ ...base, ...variants[variant], ...style }}>{children}</button>;
}
function Input({ label, value, onChange, placeholder, type = "text", style = {} }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
      {label && <div style={{ fontSize: 11, fontWeight: 700, color: C.hint, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>}
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        style={{ padding: "9px 12px", borderRadius: 10, border: `1px solid ${C.border}`, fontSize: 13, color: C.navy, background: C.bg, width: "100%", ...style }} />
    </div>
  );
}
function Modal({ title, children, onClose, width = 480 }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,39,70,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 20, padding: 28, width, maxWidth: "95vw", maxHeight: "90vh", overflowY: "auto", boxShadow: "0 18px 50px rgba(7,49,94,0.2)", animation: "fadeIn 200ms ease" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.navy }}>{title}</div>
          <button onClick={onClose} style={{ background: C.bg, border: "none", borderRadius: 8, width: 30, height: 30, cursor: "pointer", fontSize: 14, color: C.muted }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Toast({ msg, onDone }) {
  useEffect(() => { if (!msg) return; const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, [msg]);
  if (!msg) return null;
  return <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 300, background: C.navy, color: "#fff", borderRadius: 14, padding: "11px 18px", fontSize: 13, fontWeight: 500, boxShadow: "0 8px 24px rgba(23,59,100,0.2)", animation: "toastIn 250ms ease", display: "flex", alignItems: "center", gap: 8 }}>✓ {msg}</div>;
}

// ── SVG Icons ──────────────────────────────────────────────────
function Icon({ d, size = 16, color = "currentColor", stroke = true }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill={stroke ? "none" : color} stroke={stroke ? color : "none"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
}

  teachers: "M12 14l9-5-9-5-9 5 9 5zM12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z",

  chat: "M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",
  rating: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z",
  logout: "M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9",
  send: "M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z",
  plus: "M12 5v14M5 12h14",
  check: "M20 6L9 17l-5-5",
  clock: "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 6v6l4 2",
  search: "M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z",
  filter: "M22 3H2l8 9.46V19l4 2v-8.54L22 3z",
  trash: "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6",
  edit: "M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z",
};

// ── Sidebar ────────────────────────────────────────────────────
function Sidebar({ role, tab, onTab, user, onLogout }) {

    { id: "chat",     label: "Chat",      icon: "chat" },

    { id: "lessons",  label: "Lessons",   icon: "lessons" },

  return (
    <aside style={{ width: 220, flexShrink: 0, background: "#fff", borderRight: `1px solid ${C.border}`, display: "flex", flexDirection: "column", height: "100vh", position: "sticky", top: 0 }}>
      {/* Logo */}
      <div style={{ padding: "16px 18px", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", gap: 10 }}>
        <div style={{ width: 32, height: 32, borderRadius: 10, background: C.navy, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 700, fontSize: 14 }}>L</div>
        <div>
          <div style={{ fontSize: 14, fontWeight: 700, color: C.navy, lineHeight: 1 }}>LearnNova</div>
          <div style={{ fontSize: 9, color: C.hint, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 2 }}>{role === "admin" ? "Admin Panel" : "Teacher Panel"}</div>

      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: "12px 10px", display: "flex", flexDirection: "column", gap: 2, overflowY: "auto" }}>
        <div style={{ fontSize: 9, color: C.hint, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 700, padding: "0 8px", marginBottom: 4 }}>Navigation</div>
        {nav.map(item => (
          <button key={item.id} onClick={() => onTab(item.id)}

            <span style={{ width: 16, display: "flex", alignItems: "center", flexShrink: 0 }}><Icon d={ICONS[item.icon]} size={15} color={tab === item.id ? "#fff" : C.muted} /></span>
            {item.label}
          </button>
        ))}
      </nav>

      {/* User */}
      <div style={{ padding: "10px", borderTop: `1px solid ${C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 12, background: C.bg }}>
          <Avatar name={user.name} size={30} />
          <div style={{ overflow: "hidden" }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.navy, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{user.name}</div>
            <div style={{ fontSize: 10, color: C.hint, textTransform: "capitalize" }}>{user.role}</div>
          </div>
        </div>
        <button onClick={onLogout} style={{ width: "100%", marginTop: 4, display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderRadius: 12, color: C.red, fontSize: 12, fontWeight: 500, background: "none", border: "none", cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>

// ── Topbar ─────────────────────────────────────────────────────
function Topbar({ tab, role, counts }) {
  const titles = { overview: "Overview", students: role === "admin" ? "Students" : "My Students", teachers: "Teachers", lessons: "Lessons", chat: "Chat", bookings: "Bookings", ratings: "Ratings" };
  const subtitles = { overview: "Your dashboard at a glance", students: `${counts.students} active`, teachers: `${counts.teachers} teachers`, lessons: "Manage content", chat: "Student messages", bookings: "Session bookings", ratings: "Leaderboard" };
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 24px", background: "#fff", borderBottom: `1px solid ${C.border}`, flexShrink: 0 }}>
      <div>
        <h1 style={{ margin: 0, fontSize: 20, fontWeight: 700, color: C.navy, lineHeight: 1 }}>{titles[tab] || tab}</h1>
        <p style={{ margin: "4px 0 0", fontSize: 11, color: C.hint }}>{subtitles[tab]}</p>
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, background: C.greenDim, border: `1px solid ${C.greenBorder}`, borderRadius: 10, padding: "5px 12px", fontSize: 12, fontWeight: 600, color: C.green }}>
          <div style={{ width: 6, height: 6, borderRadius: "50%", background: C.green }} />
          System Online
        </div>
      </div>
    </div>
  );
}

// ── Overview Page ──────────────────────────────────────────────
function OverviewPage({ role, students, teachers, bookings, onTab }) {
  const statCards = role === "admin" ? [
    { label: "Total Students", value: students.length, color: C.blueAccent, bg: C.blueDim, icon: ICONS.students, tab: "students" },
    { label: "Total Teachers", value: teachers.length, color: C.green, bg: C.greenDim, icon: ICONS.teachers, tab: "teachers" },
    { label: "Pending Bookings", value: bookings.filter(b => b.status === "pending").length, color: C.amber, bg: C.amberDim, icon: ICONS.calendar, tab: "bookings" },
    { label: "Pro Students", value: students.filter(s => s.plan === "pro").length, color: C.purple, bg: C.purpleDim, icon: ICONS.rating, tab: "students" },
  ] : [
    { label: "My Students", value: students.length, color: C.blueAccent, bg: C.blueDim, icon: ICONS.students, tab: "students" },
    { label: "Upcoming Sessions", value: bookings.filter(b => b.status === "confirmed").length, color: C.green, bg: C.greenDim, icon: ICONS.calendar, tab: "bookings" },
    { label: "Pending Requests", value: bookings.filter(b => b.status === "pending").length, color: C.amber, bg: C.amberDim, icon: ICONS.clock, tab: "bookings" },
    { label: "Unread Chats", value: 2, color: C.purple, bg: C.purpleDim, icon: ICONS.chat, tab: "chat" },
  ];

  const recentBookings = [...bookings].slice(0, 3);

  return (
    <div style={{ padding: 24, display: "flex", flexDirection: "column", gap: 20 }}>
      {/* Stat cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {statCards.map(s => (
          <Card key={s.label} onClick={() => onTab(s.tab)} style={{ cursor: "pointer" }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: s.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon d={s.icon} size={17} color={s.color} />
              </div>
            </div>
            <div style={{ fontSize: 28, fontWeight: 700, color: s.color, lineHeight: 1, marginBottom: 4 }}>{s.value}</div>
            <div style={{ fontSize: 12, color: C.muted }}>{s.label}</div>
          </Card>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        {/* Recent bookings */}
        <Card>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            <SLabel style={{ marginBottom: 0 }}>Recent Bookings</SLabel>
            <button onClick={() => onTab("bookings")} style={{ fontSize: 12, fontWeight: 700, color: C.blueAccent, background: "none", border: "none", cursor: "pointer" }}>View all →</button>
          </div>
          {recentBookings.map((b, i) => {
            const student = MOCK_STUDENTS.find(s => s.id === b.studentId);
            const teacher = MOCK_TEACHERS.find(t => t.id === b.teacherId);
            return (
              <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: i < recentBookings.length - 1 ? `1px solid ${C.border}` : "none" }}>
                <Avatar name={student?.name || "?"} size={32} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{student?.name}</div>
                  <div style={{ fontSize: 11, color: C.hint }}>{b.program} · {b.date} {b.time}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

// ── Chat Page ──────────────────────────────────────────────────
function ChatPage({ role, currentUser, students, teachers }) {
  const [selectedStudent, setSelectedStudent] = useState(students[0]);
  const [chats, setChats] = useState(SEED_CHATS);
  const [text, setText] = useState("");
  const messagesEndRef = useRef(null);

  const chatKey = selectedStudent ? `${selectedStudent.id}-${currentUser.id}` : null;
  const messages = chatKey ? (chats[chatKey] || []) : [];

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages.length]);

  const sendMessage = () => {
    if (!text.trim() || !chatKey) return;
    const newMsg = { id: Date.now(), senderId: currentUser.id, role: role, text: text.trim(), time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
    setChats(prev => ({ ...prev, [chatKey]: [...(prev[chatKey] || []), newMsg] }));
    setText("");
  };

  return (
    <div style={{ display: "flex", height: "calc(100vh - 73px)", overflow: "hidden" }}>
      {/* Student list */}
      <div style={{ width: 260, borderRight: `1px solid ${C.border}`, background: "#fff", display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "14px 14px 10px" }}>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon d={ICONS.search} size={13} color={C.hint} /></span>
            <input placeholder="Search…" style={{ width: "100%", padding: "8px 10px 8px 30px", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, background: C.bg, color: C.navy, fontFamily: "'DM Sans',sans-serif" }} />
          </div>
        </div>
        <div style={{ flex: 1, overflowY: "auto" }}>
          {students.map(s => {
            const key = `${s.id}-${currentUser.id}`;
            const msgs = chats[key] || [];
            const last = msgs[msgs.length - 1];
            const isSelected = selectedStudent?.id === s.id;
            return (
              <div key={s.id} onClick={() => setSelectedStudent(s)}
                style={{ padding: "12px 14px", cursor: "pointer", background: isSelected ? C.bg : "transparent", borderBottom: `1px solid ${C.border}`, transition: "background 120ms" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ position: "relative", flexShrink: 0 }}>
                    <Avatar name={s.name} size={36} />
                    <div style={{ position: "absolute", bottom: 0, right: 0, width: 10, height: 10, borderRadius: "50%", background: C.green, border: "2px solid #fff" }} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: isSelected ? 700 : 600, color: C.navy, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 130 }}>{s.name}</div>
                      {last && <div style={{ fontSize: 10, color: C.hint }}>{last.time}</div>}
                    </div>
                    <div style={{ fontSize: 11, color: C.hint, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {last ? last.text : "No messages yet"}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Chat window */}
      {selectedStudent ? (
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          {/* Chat header */}
          <div style={{ padding: "12px 20px", background: "#fff", borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", gap: 12 }}>
            <Avatar name={selectedStudent.name} size={36} />
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.navy }}>{selectedStudent.name}</div>
              <div style={{ fontSize: 11, color: C.green, fontWeight: 600 }}>● Online · {selectedStudent.programAssignments.map(a => PROGRAM_LABELS[a.programId]).join(", ")}</div>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
              <PlanTag plan={selectedStudent.plan} />
              <Tag label={`🔥 ${selectedStudent.streak} streak`} bg={C.amberDim} color={C.amber} />
            </div>
          </div>

          {/* Messages */}
          <div style={{ flex: 1, overflowY: "auto", padding: "20px", display: "flex", flexDirection: "column", gap: 12, background: C.bg }}>
            {messages.length === 0 && (
              <div style={{ textAlign: "center", color: C.hint, fontSize: 13, marginTop: 40 }}>No messages yet. Start the conversation!</div>
            )}
            {messages.map(msg => {
              const isMe = msg.senderId === currentUser.id;
              return (
                <div key={msg.id} style={{ display: "flex", justifyContent: isMe ? "flex-end" : "flex-start" }}>
                  <div>
                    <div style={{ maxWidth: 360, padding: "10px 14px", borderRadius: isMe ? "14px 14px 4px 14px" : "14px 14px 14px 4px", background: isMe ? C.navy : "#fff", color: isMe ? "#fff" : C.navy, fontSize: 13, lineHeight: 1.5, boxShadow: "0 2px 8px rgba(23,59,100,0.08)", border: isMe ? "none" : `1px solid ${C.border}` }}>{msg.text}</div>
                    <div style={{ fontSize: 10, color: C.hint, marginTop: 3, textAlign: isMe ? "right" : "left" }}>{msg.time}</div>
                  </div>
                </div>
              );
            })}
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div style={{ padding: "12px 20px", background: "#fff", borderTop: `1px solid ${C.border}`, display: "flex", gap: 10, alignItems: "flex-end" }}>
            <textarea value={text} onChange={e => setText(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              placeholder="Type a message… (Enter to send)"
              rows={2}
              style={{ flex: 1, padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 12, fontSize: 13, color: C.navy, resize: "none", fontFamily: "'DM Sans',sans-serif", background: C.bg, lineHeight: 1.5 }} />
            <button onClick={sendMessage} style={{ width: 42, height: 42, borderRadius: 12, background: C.navy, border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Icon d={ICONS.send} size={16} color="#fff" />
            </button>
          </div>
        </div>
      ) : (
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: C.hint, fontSize: 14 }}>Select a student to start chatting</div>
      )}
    </div>
  );
}

  const PLAN_DURATION = { plus: 30, pro: 90 };

  const filtered = bookings.filter(b => filter === "all" || b.status === filter);

                  </div>
                </div>

                {/* Details */}
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", flex: 1, justifyContent: "center" }}>
                  <Tag label={b.program} bg={C.blueDim} color={C.blueAccent} />
                  <Tag label={`${b.date} · ${b.time}`} bg={C.bg} color={C.textSub} />
                  <Tag label={`${b.duration} min`} bg={b.duration === 90 ? C.purpleDim : C.blueDim} color={b.duration === 90 ? C.purple : C.blueAccent} />
                  <PlanTag plan={b.plan} />
                </div>

                {/* Status + actions */}
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginLeft: "auto" }}>
                  <Tag label={b.status} bg={b.status === "confirmed" ? C.greenDim : C.amberDim} color={b.status === "confirmed" ? C.green : C.amber} />
                  {b.status === "pending" && <Btn variant="success" onClick={() => confirm(b.id)} style={{ padding: "5px 12px", fontSize: 12 }}><Icon d={ICONS.check} size={12} color={C.green} /> Confirm</Btn>}
                  <Btn variant="danger" onClick={() => cancel(b.id)} style={{ padding: "5px 10px", fontSize: 12 }}><Icon d={ICONS.trash} size={12} color={C.red} /></Btn>
                </div>
              </div>
            </Card>
          );
        })}
        {filtered.length === 0 && <div style={{ textAlign: "center", padding: "60px 0", color: C.hint, fontSize: 14 }}>No bookings found</div>}
      </div>

      {/* Add booking modal */}
      {showAdd && (
        <Modal title="New Booking Request" onClose={() => setShowAdd(false)}>
          <div style={{ display: "grid", gap: 14 }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.hint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Student</div>
              <select value={newB.studentId} onChange={e => setNewB(p => ({ ...p, studentId: e.target.value }))}
                style={{ width: "100%", padding: "9px 12px", borderRadius: 10, border: `1px solid ${C.border}`, fontSize: 13, color: C.navy, background: C.bg, fontFamily: "'DM Sans',sans-serif" }}>
                {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.plan})</option>)}
              </select>
            </div>
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.hint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>Teacher</div>
              <select value={newB.teacherId} onChange={e => setNewB(p => ({ ...p, teacherId: e.target.value }))}
                style={{ width: "100%", padding: "9px 12px", borderRadius: 10, border: `1px solid ${C.border}`, fontSize: 13, color: C.navy, background: C.bg, fontFamily: "'DM Sans',sans-serif" }}>
                {teachers.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Input label="Date" value={newB.date} onChange={v => setNewB(p => ({ ...p, date: v }))} type="date" />
              <Input label="Time" value={newB.time} onChange={v => setNewB(p => ({ ...p, time: v }))} type="time" />
            </div>
            {/* Duration hint */}
            {newB.studentId && (() => {
              const s = students.find(st => st.id === newB.studentId);
              const dur = PLAN_DURATION[s?.plan] || 30;
              return (
                <div style={{ background: s?.plan === "pro" ? C.purpleDim : C.blueDim, borderRadius: 10, padding: "10px 14px", fontSize: 12, color: s?.plan === "pro" ? C.purple : C.blueAccent, fontWeight: 600 }}>
                  Session duration: <strong>{dur} minutes</strong> ({s?.plan} plan · every 2 days)
                </div>
              );
            })()}
            <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
              <Btn onClick={addBooking}>Create Booking</Btn>
              <Btn variant="ghost" onClick={() => setShowAdd(false)}>Cancel</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Ratings Page ───────────────────────────────────────────────
function RatingsPage({ students }) {
  const ranked = [...students].sort((a, b) => b.points - a.points);
  return (
    <div style={{ padding: 24 }}>
      <Card style={{ padding: 0, overflow: "hidden" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ background: C.bg }}>
              {["Rank", "Student", "Plan", "Programs", "Points", "Streak", "SAT", "IELTS"].map(h => (
                <th key={h} style={{ padding: "10px 16px", textAlign: "left", fontSize: 10, fontWeight: 700, color: C.hint, textTransform: "uppercase", letterSpacing: "0.06em", borderBottom: `1px solid ${C.border}` }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {ranked.map((s, i) => (
              <tr key={s.id} style={{ background: i === 0 ? "rgba(255,222,112,0.06)" : "transparent" }}>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 16, fontWeight: 700, color: i < 3 ? [C.amber, C.hint, "#cd7f32"][i] : C.hint }}>
                  {i < 3 ? ["🥇","🥈","🥉"][i] : `#${i+1}`}
                </td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <Avatar name={s.name} size={30} />
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: C.navy }}>{s.name}</div>
                      <div style={{ fontSize: 11, color: C.hint }}>{s.email}</div>
                    </div>
                  </div>
                </td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}><PlanTag plan={s.plan} /></td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 12, color: C.textSub }}>{s.programAssignments.map(a => PROGRAM_LABELS[a.programId]).join(", ")}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 15, fontWeight: 700, color: C.blueAccent }}>{s.points}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 13, color: C.amber, fontWeight: 600 }}>🔥 {s.streak}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 13, fontWeight: 700, color: s.sat.current ? C.blueAccent : C.hint }}>{s.sat.current || "—"}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 13, fontWeight: 700, color: s.ielts.current ? C.green : C.hint }}>{s.ielts.current || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

// ── Lessons Page (stub) ────────────────────────────────────────
function LessonsPage({ showToast }) {
  const programs = ["SAT Math", "SAT English", "IELTS"];
  const [prog, setProg] = useState("SAT Math");
  const lessons = [
    { title: "Algebra: Linear Equations", level: "Beginner", questions: 20, done: true },
    { title: "Algebra: Quadratic Functions", level: "Intermediate", questions: 18, done: true },
    { title: "Geometry: Triangles", level: "Intermediate", questions: 22, done: false },
    { title: "Data Analysis", level: "Advanced", questions: 25, done: false },
  ];
  return (
    <div style={{ padding: 24 }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {programs.map(p => (
          <button key={p} onClick={() => setProg(p)}
            style={{ padding: "8px 16px", borderRadius: 10, border: `1px solid ${prog === p ? C.navy : C.border}`, background: prog === p ? C.navy : "#fff", color: prog === p ? "#fff" : C.muted, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}>
            {p}
          </button>
        ))}
        <Btn onClick={() => showToast("Add lesson")} style={{ marginLeft: "auto" }}><Icon d={ICONS.plus} size={13} color="#fff" /> Add Lesson</Btn>
      </div>
      <Card style={{ padding: 0, overflow: "hidden" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead><tr style={{ background: C.bg }}>{["Title","Level","Questions","Status",""].map(h => <th key={h} style={{ padding: "10px 16px", textAlign: "left", fontSize: 10, fontWeight: 700, color: C.hint, textTransform: "uppercase", letterSpacing: "0.06em", borderBottom: `1px solid ${C.border}` }}>{h}</th>)}</tr></thead>
          <tbody>
            {lessons.map((l, i) => (
              <tr key={l.title}>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 13, fontWeight: 600, color: C.navy }}>{l.title}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}><Tag label={l.level} bg={C.bg} color={C.muted} /></td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}`, fontSize: 13, color: C.textSub }}>{l.questions}</td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}><Tag label={l.done ? "Published" : "Draft"} bg={l.done ? C.greenDim : C.amberDim} color={l.done ? C.green : C.amber} /></td>
                <td style={{ padding: "12px 16px", borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <Btn variant="ghost" style={{ padding: "5px 10px", fontSize: 12 }}><Icon d={ICONS.edit} size={12} color={C.muted} /></Btn>
                    <Btn variant="danger" onClick={() => showToast("Lesson deleted")} style={{ padding: "5px 10px", fontSize: 12 }}><Icon d={ICONS.trash} size={12} color={C.red} /></Btn>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

// ── Root App ───────────────────────────────────────────────────
function App() {
  const [role, setRole] = useState("admin");
  const [tab, setTab] = useState("overview");
  const [toast, setToast] = useState("");

  const showToast = (msg) => setToast(msg);

  const teacherStudents = MOCK_STUDENTS.filter(s =>
    s.programAssignments.some(a => a.teacherId === "t1")
  );
  const myStudents = role === "admin" ? MOCK_STUDENTS : teacherStudents;

  const myBookings = role === "admin" ? SEED_BOOKINGS : SEED_BOOKINGS.filter(b => b.teacherId === "t1");

  const counts = { students: myStudents.length, teachers: MOCK_TEACHERS.length };

  const user = role === "admin" ? MOCK_USER : { ...MOCK_TEACHERS[0], role: "teacher" };

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <Sidebar role={role} tab={tab} onTab={setTab} user={user}
        onLogout={() => alert("Logged out")} />

      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        {/* Role switcher strip */}
        <div style={{ background: C.navyDark, padding: "6px 24px", display: "flex", gap: 8, alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#9EB3C8" }}>Preview as:</span>
          {["admin", "teacher"].map(r => (
            <button key={r} onClick={() => { setRole(r); setTab("overview"); }}
              style={{ padding: "3px 12px", borderRadius: 6, border: "none", background: role === r ? C.yellow : "rgba(255,255,255,0.08)", color: role === r ? C.navy : "#9EB3C8", fontSize: 11, fontWeight: 700, cursor: "pointer", textTransform: "capitalize", fontFamily: "'DM Sans',sans-serif" }}>
              {r}
            </button>
          ))}
        </div>

        <Topbar tab={tab} role={role} counts={counts} />

        <div style={{ flex: 1, overflowY: "auto" }}>
          {tab === "overview" && <OverviewPage role={role} students={myStudents} teachers={MOCK_TEACHERS} bookings={myBookings} onTab={setTab} />}
          {tab === "students" && <StudentsPage students={myStudents} teachers={MOCK_TEACHERS} role={role} showToast={showToast} />}
          {tab === "teachers" && role === "admin" && <TeachersPage teachers={MOCK_TEACHERS} showToast={showToast} />}
          {tab === "chat" && <ChatPage role={role} currentUser={user} students={myStudents} teachers={MOCK_TEACHERS} />}
          {tab === "bookings" && <BookingsPage role={role} bookings={myBookings} students={myStudents} teachers={MOCK_TEACHERS} showToast={showToast} />}
          {tab === "ratings" && <RatingsPage students={myStudents} />}
          {tab === "lessons" && <LessonsPage showToast={showToast} />}
        </div>
      </div>

      <Toast msg={toast} onDone={() => setToast("")} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
